<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khởi động FireGuard</title>
<style>
  :root { color-scheme: dark; font: 17px/1.6 system-ui, sans-serif; background: #071321; color: #e2edf9; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(480px, 85vw); padding: 32px; border: 1px solid #294157; border-radius: 24px; background: #102237; }
  h1 { margin: 0; font-size: 28px; } p { color: #b0c5da; }
  ul { padding: 0; list-style: none; } li { padding: 14px 0; border-bottom: 1px solid #294157; }
  span { float: right; } button { font: inherit; background: #52c9eb; color: #071321; border: 0; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
</style>
<main>
  <h1>FireGuard</h1>
  <p>Đang chuẩn bị hệ thống. Trang sẽ tự mở khi cả giao diện và máy chủ sẵn sàng.</p>
  <ul aria-live="polite">
    <li>Giao diện <span id="frontend">Đang chờ…</span></li>
    <li>Máy chủ <span id="backend">Đang chờ…</span></li>
  </ul>
  <p id="message" role="status">Lần khởi động đầu có thể mất vài phút. Vui lòng giữ trang này mở.</p>
  <button id="retry" hidden>Thử lại</button>
  <noscript>Vui lòng bật JavaScript để khởi động hệ thống.</noscript>
</main>
<script src="launcher.js" type="module"></script>
</html>
