# Production stack on the Compute Engine VM (/opt/fireguard).
# Values come from /opt/fireguard/.env (see .env.example). CI updates TAG on each deploy.
services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    image: ${REGISTRY}/backend:${TAG}
    restart: unless-stopped
    environment:
      GCS_BUCKET: ${GCS_BUCKET}
      MYSQL_HOST: ${MYSQL_HOST:?set MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:?set MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_SSL_CA: /run/secrets/aiven-ca.pem
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      CORS_ORIGINS: https://${DOMAIN}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-}
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_CHAT_ID: ${ZALO_CHAT_ID:-}
      ZALO_ENABLED: ${ZALO_ENABLED:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-}
    volumes:
      - backend_data:/data
      - type: bind
        source: ${MYSQL_SSL_CA_HOST_PATH:?set absolute CA path on host}
        target: /run/secrets/aiven-ca.pem
        read_only: true
        bind:
          create_host_path: false

  frontend:
    image: ${REGISTRY}/frontend:${TAG}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  backend_data:
